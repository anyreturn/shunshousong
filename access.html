<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顺手送 - 无需密码访问</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .service-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .service-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .service-card h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .service-card p {
            color: #666;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .service-card a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        .service-card a:hover {
            background: #5568d3;
        }
        .password-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }
        .password-box p {
            color: #856404;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .password-box code {
            background: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            color: #856404;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }
        .status.online {
            background: #d4edda;
            color: #155724;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            text-align: center;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 顺手送</h1>
        <p class="subtitle">在线服务访问入口</p>

        <div class="password-box">
            <p><strong>🔑 Tunnel Password（如需直接访问）:</strong></p>
            <p><code id="password">8.152.234.182</code></p>
            <p style="margin-top: 8px; font-size: 12px;">💡 提示：点击下方按钮可跳过密码页面</p>
        </div>

        <div class="service-card">
            <h3>📡 API 服务 <span class="status online">运行中</span></h3>
            <p>后端 API 接口服务 (端口 4000)</p>
            <a href="#" onclick="openWithBypass('https://shunshousong-api.loca.lt')">访问 API →</a>
        </div>

        <div class="service-card">
            <h3>🔧 管理后台 <span class="status online">运行中</span></h3>
            <p>系统管理界面 (端口 9000)</p>
            <a href="#" onclick="openWithBypass('https://shunshousong-admin.loca.lt')">访问后台 →</a>
        </div>

        <div class="service-card">
            <h3>👤 用户服务 <span class="status online">运行中</span></h3>
            <p>用户端服务 (端口 8888)</p>
            <a href="#" onclick="openWithBypass('https://shunshousong-user.loca.lt')">访问服务 →</a>
        </div>

        <div class="footer">
            <p>服务状态自动检测 · 最后更新：<span id="timestamp"></span></p>
        </div>
    </div>

    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString('zh-CN');

        function openWithBypass(url) {
            const win = window.open(url, '_blank');
            alert('🔓 已打开链接！\n\n如果看到密码页面：\n1. 输入密码：8.152.234.182\n2. 或点击 "Click to Continue"\n\n同一 IP 7 天内只需输入一次。');
        }
    </script>
</body>
</html>
